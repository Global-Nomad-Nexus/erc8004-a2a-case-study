<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
<title id="title">Governance evidence pathway for ERC-8004 and A2A</title>
<desc id="desc">ERC-8004 has public proposals and review with separate deployment. A2A permits contributions but initial binding votes are held by an eight-seat Technical Steering Committee. Public records show concentration, different deliberation, and scope-dependent connectivity. The six-stage reproducibility pathway leads from source records to checked figures; the comparison is descriptive.</desc>
