<rect x="64" y="50" width="5" height="60" rx="2" fill="#34D3E6" stroke="none" stroke-width="1"/>
<text x="88" y="79" fill="#F3F7FF" font-size="42" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Who governs AI-agent interoperability?</text>
<text x="88" y="113" fill="#B5C3D8" font-size="19" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Two standards · one infrastructure problem · different routes to binding decisions</text>
