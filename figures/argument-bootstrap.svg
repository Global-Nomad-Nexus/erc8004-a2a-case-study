<text x="65" y="673" fill="#F9C66B" font-size="17" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">All displayed 95% intervals touch or cross zero; uncertainty is from record resampling only.</text>
<text x="65" y="701" fill="#B5C3D8" font-size="16" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Each resample uses 142 records per case. This does not balance platform maturity or organizational resources.</text>
</svg>
