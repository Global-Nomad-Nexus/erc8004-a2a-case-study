<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">Equal-size bootstrap intervals for argument categories</title>
<desc id="desc">Point estimates and 95 percent intervals for five A2A minus ERC-8004 argument-type shares. Each bootstrap draws 142 records per case, 2000 times. All intervals include or touch zero.</desc>
<rect x="0" y="0" width="1200" height="740" rx="0" fill="#0B1220" stroke="none" stroke-width="1"/>
<text x="65" y="72" fill="#F3F7FF" font-size="32" font-weight="700" text-anchor="start" font-family="Arial, Helvetica, sans-serif">Equal-size resampling qualifies the discourse contrast</text>
<text x="65" y="108" fill="#B5C3D8" font-size="17" font-weight="400" text-anchor="start" font-family="Arial, Helvetica, sans-serif">A2A minus ERC-8004 · percentage points · 2,000 bootstrap resamples</text>
